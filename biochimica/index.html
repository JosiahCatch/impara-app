<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Impara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=Public+Sans:wght@400;600&display=swap">
<style>
:root { --paper: #f4f6f8; --sheet: #fff; --ink: #16202b; --ink-soft: #46525f; --rule: #d8dee5; --accent: #1f4e79; --door: #1f4e79; --bad: #b3261e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #11161c; --sheet: #182029; --ink: #e5e9ee; --ink-soft: #b2bcc7; --rule: #2b3542; --accent: #8cb6e0; --door: #1a3553; --bad: #f08a82; color-scheme: dark; } }
:root[data-theme="dark"] { --paper: #11161c; --sheet: #182029; --ink: #e5e9ee; --ink-soft: #b2bcc7; --rule: #2b3542; --accent: #8cb6e0; --door: #1a3553; --bad: #f08a82; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 "Public Sans", "Segoe UI", system-ui, sans-serif; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.door { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.side { background: var(--door); color: #fff; padding: clamp(28px, 6vw, 72px); display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
.side h1 { font: 700 clamp(3.4rem, 10vw, 7.5rem)/.9 Spectral, Georgia, serif; letter-spacing: -.02em; margin: 0; }
.side p { max-width: 34ch; font-size: 1.05rem; color: rgba(255,255,255,.82); margin: 18px 0 0; }
.side .foot { font-size: .88rem; color: rgba(255,255,255,.75); max-width: 40ch; margin: 0; }
.form { display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
form { width: 100%; max-width: 340px; display: grid; gap: 16px; }
h2 { font: 600 1.7rem/1.15 Spectral, Georgia, serif; margin: 0; }
.field { display: grid; gap: 6px; }
label { font-size: .9rem; font-weight: 600; }
input { padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet); font-size: 1rem; }
.err { color: var(--bad); font-size: .9rem; margin: 0; min-height: 1.4em; }
button { padding: 13px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--sheet); font-weight: 600; cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
@media (max-width: 720px) { .door { grid-template-columns: minmax(0, 1fr); } .side { gap: 28px; } }
</style>
</head>
<body>
<div class="door">
  <div class="side">
    <div><h1>Impara</h1><p>Esami di allenamento per Medicina, costruiti sul libro del corso, capitolo per capitolo.</p></div>
    <p class="foot">Riservato a chi studia sul libro del corso: entra con l'utente e la password che ti hanno dato.</p>
  </div>
  <div class="form">
    <form id="f" novalidate>
      <h2>Entra</h2>
      <div class="field"><label for="u">Utente</label><input id="u" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"></div>
      <p class="err" id="err" role="alert"></p>
      <button type="submit" id="b">Entra</button>
    </form>
  </div>
</div>
